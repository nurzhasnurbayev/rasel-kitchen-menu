<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The header's violet (--color-brand in src/theme.css), so the browser bar continues it. -->
		<meta name="theme-color" content="#aa72ab" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#8a5a8c" media="(prefers-color-scheme: dark)" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
